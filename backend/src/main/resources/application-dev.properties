# Dữ liệu demo được nạp bằng SQL sau khi Hibernate đã cập nhật cấu trúc bảng.
# Các câu lệnh trong data.sql đều idempotent nên không ghi đè dữ liệu đang có.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true
