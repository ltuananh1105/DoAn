spring.datasource.url=${DB_URL:jdbc:sqlserver://TUANANH;databaseName=learnup_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1111}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:learnup-demo-secret-key-change-before-production-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
# Gemini AI - không ghi API key thật vào source code.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
